<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Chips da Serra - Vendas</title>
  
  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <!-- Firebase App e Firestore (SDK v10 Modular via CDN) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
      getFirestore, 
      collection, 
      addDoc, 
      onSnapshot, 
      query, 
      orderBy, 
      deleteDoc, 
      doc, 
      setDoc, 
      getDoc, 
      serverTimestamp,
      where 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // Suas configurações do Firebase (NÃO ALTERAR ESTE BLOCO)
    const firebaseConfig = {
      apiKey: "AIzaSyD...", // Sua apiKey do Firebase
      authDomain: "chips-da-serra.firebaseapp.com",
      projectId: "chips-da-serra",
      storageBucket: "chips-da-serra.appspot.com",
      messagingSenderId: "...",
      appId: "..."
    };

    // Inicializa o Firebase
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // Torna as instâncias globais para uso nas funções do app
    window.db = db;
    window.firestoreTools = { collection, addDoc, onSnapshot, query, orderBy, deleteDoc, doc, setDoc, getDoc, serverTimestamp, where };
  </script>

  <style>
    /* Estilos personalizados para experiência mobile-app */
    body {
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      background-color: #F8FAFC; /* slate-50 */
    }
    .flavor-btn.active {
      background-color: #f59e0b; /* amber-500 */
      color: white;
      border-color: #f59e0b;
    }
  </style>
</head>
<body class="text-slate-800 font-sans min-h-screen flex flex-col">

  <!-- Cabeçalho -->
  <header class="bg-white text-slate-900 p-4 shadow-sm flex justify-between items-center sticky top-0 z-10 border-b border-slate-100">
    <div class="flex items-center space-x-3">
      <!-- Logo SVG baseada na imagem enviada -->
      <svg class="w-9 h-9" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M50 15L15 65H85L50 15Z" fill="#6B8E23"/> <!-- Verde Oliva -->
        <path d="M50 35L30 65H70L50 35Z" fill="#556B2F"/> <!-- Verde Oliva Escuro -->
      </svg>
      <h1 class="text-2xl font-extrabold tracking-tighter text-slate-950">Chips<span class="text-amber-500">.</span>daSerra</h1>
    </div>
    <span id="status-sync" class="text-xs bg-emerald-50 text-emerald-700 px-3 py-1.5 rounded-full flex items-center gap-1.5 font-medium border border-emerald-100">
      <span class="w-2 h-2 bg-emerald-500 rounded-full animate-pulse"></span>
      Sincronizado
    </span>
  </header>

  <!-- Conteúdo Principal -->
  <main class="flex-1 p-4 max-w-lg mx-auto w-full pb-24">
    <div id="app-content">
      <!-- O aplicativo renderiza dinamicamente as abas aqui -->
    </div>
  </main>

  <!-- Barra de Navegação Inferior -->
  <nav class="fixed bottom-0 left-0 right-0 bg-white p-2 pb-3 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)] border-t border-slate-100 z-10 flex justify-around items-center max-w-lg mx-auto rounded-t-2xl">
    <button onclick="router.navigate('dashboard')" class="nav-link flex flex-col items-center p-2 text-slate-500 active:text-amber-500" data-page="dashboard">
      <i data-lucide="layout-grid" class="w-6 h-6"></i>
      <span class="text-xs font-medium mt-1">Painel</span>
    </button>
    <button onclick="router.navigate('vendas')" class="nav-link flex flex-col items-center p-2 text-slate-500 active:text-amber-500" data-page="vendas">
      <i data-lucide="shopping-cart" class="w-6 h-6"></i>
      <span class="text-xs font-medium mt-1">Vendas</span>
    </button>
    <button onclick="router.navigate('clientes')" class="nav-link flex flex-col items-center p-2 text-slate-500 active:text-amber-500" data-page="clientes">
      <i data-lucide="users" class="w-6 h-6"></i>
      <span class="text-xs font-medium mt-1">Clientes</span>
    </button>
    <button onclick="router.navigate('admin')" class="nav-link flex flex-col items-center p-2 text-slate-500 active:text-amber-500" data-page="admin">
      <i data-lucide="settings" class="w-6 h-6"></i>
      <span class="text-xs font-medium mt-1">Admin</span>
    </button>
  </nav>

  <script type="module">
    import { format } from "https://cdn.skypack.dev/date-fns";
    import { ptBR } from "https://cdn.skypack.dev/date-fns/locale";

    const { db, firestoreTools } = window;
    const { collection, addDoc, onSnapshot, query, orderBy, where, serverTimestamp } = firestoreTools;

    // Definição dos sabores solicitados
    const SABORES = [
      "Batata Inglesa",
      "Batata Doce",
      "Macaxeira",
      "Banana",
      "Pururuca de Bacon"
    ];

    // --- Sistema de Roteamento Simples ---
    const router = {
      currentPage: null,
      navigate(page) {
        if (this.currentPage === page) return;
        this.currentPage = page;
        this.renderPage(page);
        this.updateNavLinks(page);
      },
      renderPage(page) {
        const content = document.getElementById('app-content');
        content.innerHTML = ''; // Limpa o conteúdo

        switch (page) {
          case 'dashboard': renderDashboard(content); break;
          case 'vendas': renderVendas(content); break;
          case 'clientes': renderClientes(content); break;
          case 'admin': renderAdmin(content); break;
          default: renderDashboard(content);
        }
        
        if (window.lucide) lucide.createIcons();
      },
      updateNavLinks(page) {
        document.querySelectorAll('.nav-link').forEach(link => {
          if (link.dataset.page === page) {
            link.classList.add('text-amber-600');
            link.classList.remove('text-slate-500');
          } else {
            link.classList.remove('text-amber-600');
            link.classList.add('text-slate-500');
          }
        });
      }
    };
    window.router = router;

    // --- Funções de Renderização de Página ---

    function renderDashboard(container) {
      const today = new Date();
      container.innerHTML = `
        <div class="space-y-6">
          <div class="flex flex-col items-center justify-center p-6 bg-white rounded-3xl shadow-sm border border-slate-100 text-center">
             <!-- Logo Grande no Painel -->
             <svg class="w-24 h-24 mb-4" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M50 15L15 65H85L50 15Z" fill="#6B8E23"/>
                <path d="M50 35L30 65H70L50 35Z" fill="#556B2F"/>
             </svg>
             <h2 class="text-3xl font-extrabold tracking-tighter text-slate-950">Chips<span class="text-amber-500">.</span>daSerra</h2>
             <p class="text-slate-500 mt-1 text-sm">Mais sabor para todos os momentos</p>
          </div>

          <!-- Filtros do Painel (Ano, Mês, Dia) -->
          <div class="bg-white p-5 rounded-3xl shadow-sm border border-slate-100 space-y-4">
            <h3 class="text-lg font-bold flex items-center gap-2"><i data-lucide="filter" class="w-5 h-5 text-amber-500"></i> Filtrar Relatório</h3>
            <div class="grid grid-cols-3 gap-3">
              <select id="dash-filter-year" class="p-3 bg-slate-50 border border-slate-200 rounded-xl text-sm"></select>
              <select id="dash-filter-month" class="p-3 bg-slate-50 border border-slate-200 rounded-xl text-sm"></select>
              <select id="dash-filter-day" class="p-3 bg-slate-50 border border-slate-200 rounded-xl text-sm"></select>
            </div>
            <button id="btn-apply-dash-filter" class="w-full bg-slate-900 text-white p-3 rounded-xl font-bold text-sm flex items-center justify-center gap-2 hover:bg-slate-800">
              <i data-lucide="search" class="w-4 h-4"></i>
              Aplicar Filtro
            </button>
          </div>

          <!-- Cards de Resumo -->
          <div class="grid grid-cols-2 gap-4">
            <div class="bg-amber-500 text-white p-5 rounded-3xl shadow-sm">
              <p class="text-xs font-medium opacity-80">Vendas no Período</p>
              <p id="dash-total-vendas" class="text-3xl font-extrabold mt-1">R$ 0,00</p>
            </div>
            <div class="bg-white p-5 rounded-3xl shadow-sm border border-slate-100">
              <p class="text-xs font-medium text-slate-500">Qtd. Produtos</p>
              <p id="dash-qtd-produtos" class="text-3xl font-extrabold mt-1 text-slate-950">0</p>
            </div>
          </div>
        </div>
      `;

      // Preenche os selects de filtro
      populateDashboardFilters(today);
      // Carrega dados iniciais (mês atual)
      loadDashboardData(today.getFullYear(), today.getMonth() + 1, today.getDate());

      // Evento do botão de filtro
      document.getElementById('btn-apply-dash-filter').addEventListener('click', () => {
        const year = parseInt(document.getElementById('dash-filter-year').value);
        const month = parseInt(document.getElementById('dash-filter-month').value);
        const day = parseInt(document.getElementById('dash-filter-day').value);
        loadDashboardData(year, month, day);
      });
    }

    function populateDashboardFilters(date) {
      const yearSelect = document.getElementById('dash-filter-year');
      const monthSelect = document.getElementById('dash-filter-month');
      const daySelect = document.getElementById('dash-filter-day');
      
      const currentYear = date.getFullYear();
      for (let y = currentYear; y >= currentYear - 2; y--) {
        const option = new Option(y, y);
        if (y === currentYear) option.selected = true;
        yearSelect.add(option);
      }

      const months = ["Janeiro", "Fevereiro", "Março", "Abril", "Maio", "Junho", "Julho", "Agosto", "Setembro", "Outubro", "Novembro", "Dezembro"];
      months.forEach((m, i) => {
        const option = new Option(m, i + 1);
        if (i === date.getMonth()) option.selected = true;
        monthSelect.add(option);
      });

      // Função para atualizar os dias baseados no mês/ano
      const updateDays = () => {
        const y = parseInt(yearSelect.value);
        const m = parseInt(monthSelect.value);
        const daysInMonth = new Date(y, m, 0).getDate();
        const currentDay = daySelect.value;
        daySelect.innerHTML = '<option value="0">Todos os Dias</option>';
        for (let d = 1; d <= daysInMonth; d++) {
          const option = new Option(d, d);
          if (parseInt(currentDay) === d) option.selected = true;
          daySelect.add(option);
        }
      };

      yearSelect.addEventListener('change', updateDays);
      monthSelect.addEventListener('change', updateDays);
      updateDays(); // Preenche inicial
    }

    function loadDashboardData(year, month, day) {
      let q = query(collection(db, "vendas"), orderBy("data", "desc"));
      
      // Filtro no Firestore é limitado (precisaria de range para datas).
      // Para simplificar e manter tempo real, filtramos no cliente.
      
      onSnapshot(q, (snapshot) => {
        let total = 0;
        let qtd = 0;

        snapshot.forEach((doc) => {
          const venda = doc.data();
          if (!venda.data || !venda.data.seconds) return;
          const dataVenda = new Date(venda.data.seconds * 1000);
          
          const matchYear = dataVenda.getFullYear() === year;
          const matchMonth = (dataVenda.getMonth() + 1) === month;
          const matchDay = day === 0 || dataVenda.getDate() === day;

          if (matchYear && matchMonth && matchDay) {
            total += venda.valorTotal || 0;
            qtd += venda.quantidade || 0;
          }
        });

        document.getElementById('dash-total-vendas').innerText = total.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
        document.getElementById('dash-qtd-produtos').innerText = qtd;
      });
    }

    // --- Página de Vendas ( Nova Venda e Histórico ) ---

    function renderVendas(container) {
      container.innerHTML = `
        <div class="space-y-6">
          <!-- Formulário de Nova Venda -->
          <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-100 space-y-5">
            <h3 class="text-xl font-bold flex items-center gap-2.5 text-slate-950"><i data-lucide="plus-circle" class="w-6 h-6 text-amber-500"></i> Registrar Nova Venda</h3>
            
            <div class="space-y-3">
              <label class="block text-sm font-medium text-slate-600">Selecione o Sabor:</label>
              <div class="grid grid-cols-2 gap-2.5" id="flavor-selection">
                ${SABORES.map(sabor => `
                  <button type="button" class="flavor-btn p-3 border border-slate-200 rounded-xl text-sm font-medium hover:border-amber-300 hover:bg-amber-50 transition-colors" data-flavor="${sabor}">${sabor}</button>
                `).join('')}
              </div>
            </div>

            <div class="grid grid-cols-2 gap-4">
              <div class="space-y-1.5">
                <label class="block text-sm font-medium text-slate-600">Quantidade</label>
                <input type="number" id="venda-qtd" placeholder="0" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-lg font-bold">
              </div>
              <div class="space-y-1.5">
                <label class="block text-sm font-medium text-slate-600">Valor Unitário (R$)</label>
                <input type="number" id="venda-valor" placeholder="0.00" step="0.50" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-lg font-bold">
              </div>
            </div>

            <div class="space-y-1.5">
              <label class="block text-sm font-medium text-slate-600">Cliente (Opcional)</label>
              <select id="venda-cliente" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-sm">
                <option value="">Selecione um cliente...</option>
              </select>
            </div>

            <button id="btn-registrar-venda" class="w-full bg-amber-500 text-white p-4 rounded-2xl font-bold text-lg flex items-center justify-center gap-2.5 hover:bg-amber-600 shadow-md shadow-amber-100">
              <i data-lucide="check-circle" class="w-6 h-6"></i>
              Confirmar Venda
            </button>
          </div>

          <!-- Filtros do Histórico de Vendas -->
          <div class="bg-white p-5 rounded-3xl shadow-sm border border-slate-100 space-y-4">
            <h3 class="text-lg font-bold flex items-center gap-2"><i data-lucide="search" class="w-5 h-5 text-amber-500"></i> Buscar no Histórico</h3>
            <div class="grid grid-cols-2 gap-3">
              <select id="filter-venda-cliente" class="p-3 bg-slate-50 border border-slate-200 rounded-xl text-sm">
                <option value="">Todos os Clientes</option>
              </select>
              <input type="date" id="filter-venda-data" class="p-3 bg-slate-50 border border-slate-200 rounded-xl text-sm">
            </div>
          </div>

          <!-- Lista de Últimas Vendas -->
          <div class="space-y-3">
            <h3 class="text-lg font-bold text-slate-900 px-1">Últimas Vendas</h3>
            <div id="lista-vendas" class="space-y-3">
              <!-- Vendas carregadas aqui -->
              <p class="text-center text-sm text-slate-500 py-4">Carregando vendas...</p>
            </div>
          </div>
        </div>
      `;

      // Logica de seleção de sabor
      let selectedFlavor = null;
      document.querySelectorAll('.flavor-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.flavor-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          selectedFlavor = btn.dataset.flavor;
        });
      });

      // Preenche select de clientes
      populateClienteSelects(['venda-cliente', 'filter-venda-cliente']);

      // Carrega Histórico
      loadVendasHistory();

      // Eventos de Filtro
      document.getElementById('filter-venda-cliente').addEventListener('change', loadVendasHistory);
      document.getElementById('filter-venda-data').addEventListener('change', loadVendasHistory);

      // Ação de Registrar
      document.getElementById('btn-registrar-venda').addEventListener('click', async () => {
        const qtd = parseInt(document.getElementById('venda-qtd').value);
        const valor = parseFloat(document.getElementById('venda-valor').value);
        const clienteId = document.getElementById('venda-cliente').value;
        const clienteNome = document.getElementById('venda-cliente').options[document.getElementById('venda-cliente').selectedIndex].text;

        if (!selectedFlavor || !qtd || !valor || qtd <= 0 || valor <= 0) {
          alert('Por favor, selecione o sabor, quantidade e valor válidos.');
          return;
        }

        const btn = document.getElementById('btn-registrar-venda');
        btn.disabled = true; btn.innerText = 'Registrando...';

        try {
          await addDoc(collection(db, "vendas"), {
            produto: selectedFlavor,
            quantidade: qtd,
            valorUnitario: valor,
            valorTotal: qtd * valor,
            clienteId: clienteId || null,
            clienteNome: clienteId ? clienteNome : "Consumidor Final",
            data: serverTimestamp()
          });
          
          // Limpa formulário
          document.querySelectorAll('.flavor-btn').forEach(b => b.classList.remove('active'));
          selectedFlavor = null;
          document.getElementById('venda-qtd').value = '';
          document.getElementById('venda-valor').value = '';
          document.getElementById('venda-cliente').value = '';
          
          alert('Venda registrada com sucesso!');
        } catch (e) {
          console.error("Erro ao salvar:", e);
          alert('Erro ao salvar venda. Tente novamente.');
        } finally {
          btn.disabled = false; btn.innerHTML = '<i data-lucide="check-circle" class="w-6 h-6"></i> Confirmar Venda';
          if (window.lucide) lucide.createIcons();
        }
      });
    }

    async function populateClienteSelects(selectIds) {
      const q = query(collection(db, "clientes"), orderBy("nome"));
      onSnapshot(q, (snapshot) => {
        selectIds.forEach(id => {
          const select = document.getElementById(id);
          if (!select) return;
          const currentVal = select.value;
          const firstOption = select.options[0];
          select.innerHTML = '';
          select.add(firstOption);
          snapshot.forEach(doc => {
            const cliente = doc.data();
            const option = new Option(cliente.nome, doc.id);
            if (doc.id === currentVal) option.selected = true;
            select.add(option);
          });
        });
      });
    }

    function loadVendasHistory() {
      const container = document.getElementById('lista-vendas');
      const filtroCliente = document.getElementById('filter-venda-cliente').value;
      const filtroData = document.getElementById('filter-venda-data').value; // YYYY-MM-DD

      let q = query(collection(db, "vendas"), orderBy("data", "desc"));
      
      // Firestore não suporta bem queries compostas sem indices.
      // Filtramos no cliente para simplicidade e tempo real.

      onSnapshot(q, (snapshot) => {
        container.innerHTML = '';
        let hasVendas = false;

        snapshot.forEach((doc) => {
          const venda = doc.data();
          if (!venda.data || !venda.data.seconds) return;
          
          const dataVenda = new Date(venda.data.seconds * 1000);
          const dataFormatada = format(dataVenda, "dd/MM/yyyy HH:mm", { locale: ptBR });
          const dataISO = dataVenda.toISOString().split('T')[0]; // YYYY-MM-DD

          // Aplica filtros no cliente
          if (filtroCliente && venda.clienteId !== filtroCliente) return;
          if (filtroData && dataISO !== filtroData) return;

          hasVendas = true;
          container.innerHTML += `
            <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100">
              <div class="flex justify-between items-start mb-2">
                <div>
                  <p class="font-bold text-slate-950">${venda.produto}</p>
                  <p class="text-xs text-slate-500 flex items-center gap-1"><i data-lucide="user" class="w-3 h-3"></i> ${venda.clienteNome}</p>
                </div>
                <p class="text-lg font-extrabold text-amber-600">${venda.valorTotal.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' })}</p>
              </div>
              <div class="flex justify-between items-center text-xs text-slate-400 border-t border-slate-50 pt-2 mt-2">
                <p>${venda.quantidade} un. x ${venda.valorUnitario.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' })}</p>
                <p>${dataFormatada}</p>
              </div>
            </div>
          `;
        });

        if (!hasVendas) {
          container.innerHTML = '<p class="text-center text-sm text-slate-500 py-6 bg-white rounded-2xl border border-slate-100">Nenhuma venda encontrada com esses filtros.</p>';
        }
        if (window.lucide) lucide.createIcons();
      });
    }

    // --- Página de Clientes ( Lista e Cadastro ) ---

    function renderClientes(container) {
      container.innerHTML = `
        <div class="space-y-6">
          <!-- Formulário de Novo Cliente -->
          <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-100 space-y-4">
            <h3 class="text-xl font-bold flex items-center gap-2.5 text-slate-950"><i data-lucide="user-plus" class="w-6 h-6 text-amber-500"></i> Cadastrar Novo Cliente</h3>
            
            <div class="space-y-1.5">
              <label class="block text-sm font-medium text-slate-600">Nome Completo</label>
              <input type="text" id="cliente-nome" placeholder="Ex: João Silva" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl">
            </div>

            <div class="space-y-1.5">
              <label class="block text-sm font-medium text-slate-600">Telefone / WhatsApp</label>
              <input type="tel" id="cliente-fone" placeholder="(88) 99999-9999" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl">
            </div>

            <!-- Novos campos de endereço solicitaados -->
            <div class="grid grid-cols-2 gap-4">
              <div class="space-y-1.5">
                <label class="block text-sm font-medium text-slate-600">Rua e Número</label>
                <input type="text" id="cliente-rua" placeholder="Rua Central, 123" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-sm">
              </div>
              <div class="space-y-1.5">
                <label class="block text-sm font-medium text-slate-600">Cidade</label>
                <input type="text" id="cliente-cidade" placeholder="Ex: Santa Quitéria" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-sm">
              </div>
            </div>

            <button id="btn-cadastrar-cliente" class="w-full bg-slate-900 text-white p-4 rounded-2xl font-bold text-lg flex items-center justify-center gap-2.5 hover:bg-slate-800">
              <i data-lucide="save" class="w-6 h-6"></i>
              Salvar Cliente
            </button>
          </div>

          <!-- Lista de Clientes -->
          <div class="space-y-3">
            <h3 class="text-lg font-bold text-slate-900 px-1">Meus Clientes</h3>
            <div id="lista-clientes" class="space-y-3">
              <!-- Clientes carregados aqui -->
              <p class="text-center text-sm text-slate-500 py-4">Carregando clientes...</p>
            </div>
          </div>
        </div>
      `;

      loadClientesList();

      document.getElementById('btn-cadastrar-cliente').addEventListener('click', async () => {
        const nome = document.getElementById('cliente-nome').value;
        const fone = document.getElementById('cliente-fone').value;
        const rua = document.getElementById('cliente-rua').value;
        const cidade = document.getElementById('cliente-cidade').value;

        if (!nome || !fone) {
          alert('Por favor, preencha pelo menos Nome e Telefone.');
          return;
        }

        const btn = document.getElementById('btn-cadastrar-cliente');
        btn.disabled = true; btn.innerText = 'Salvando...';

        try {
          await addDoc(collection(db, "clientes"), {
            nome: nome,
            telefone: fone,
            rua: rua || "",
            cidade: cidade || "",
            dataCadastro: serverTimestamp()
          });
          
          document.getElementById('cliente-nome').value = '';
          document.getElementById('cliente-fone').value = '';
          document.getElementById('cliente-rua').value = '';
          document.getElementById('cliente-cidade').value = '';
          alert('Cliente cadastrado com sucesso!');
        } catch (e) {
          console.error("Erro ao cadastrar:", e);
          alert('Erro ao cadastrar cliente.');
        } finally {
          btn.disabled = false; btn.innerHTML = '<i data-lucide="save" class="w-6 h-6"></i> Salvar Cliente';
          if (window.lucide) lucide.createIcons();
        }
      });
    }

    function loadClientesList() {
      const container = document.getElementById('lista-clientes');
      const q = query(collection(db, "clientes"), orderBy("nome"));

      onSnapshot(q, (snapshot) => {
        container.innerHTML = '';
        let hasClientes = false;
        snapshot.forEach((doc) => {
          hasClientes = true;
          const cliente = doc.data();
          const endereco = [cliente.rua, cliente.cidade].filter(Boolean).join(', ');
          container.innerHTML += `
            <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 flex justify-between items-center gap-3">
              <div>
                <p class="font-bold text-slate-950">${cliente.nome}</p>
                <p class="text-xs text-amber-700 font-medium flex items-center gap-1.5 mt-1"><i data-lucide="phone" class="w-3.5 h-3.5"></i> ${cliente.telefone}</p>
                ${endereco ? `<p class="text-xs text-slate-500 flex items-center gap-1.5 mt-1"><i data-lucide="map-pin" class="w-3.5 h-3.5"></i> ${endereco}</p>` : ''}
              </div>
              <a href="https://wa.me/55${cliente.telefone.replace(/\D/g,'')}" target="_blank" class="p-3 bg-emerald-50 text-emerald-600 rounded-full hover:bg-emerald-100 flex-shrink-0">
                <i data-lucide="message-circle" class="w-5 h-5"></i>
              </a>
            </div>
          `;
        });
        if (!hasClientes) {
          container.innerHTML = '<p class="text-center text-sm text-slate-500 py-6 bg-white rounded-2xl border border-slate-100">Nenhum cliente cadastrado.</p>';
        }
        if (window.lucide) lucide.createIcons();
      });
    }

    // --- Página Admin ---
    function renderAdmin(container) {
       container.innerHTML = `
        <div class="space-y-6">
          <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-100 space-y-4">
            <h3 class="text-xl font-bold flex items-center gap-2.5 text-slate-950"><i data-lucide="settings" class="w-6 h-6 text-amber-500"></i> Configurações</h3>
            <p class="text-sm text-slate-600">Aba de configurações do sistema. Funcionalidades extras podem ser adicionadas aqui.</p>
             <div class="p-4 bg-slate-100 text-slate-700 rounded-xl text-center text-xs font-mono">
               Acesso Restrito
             </div>
          </div>
        </div>
      `;
    }

    // --- Inicialização do App ---
    document.addEventListener("DOMContentLoaded", () => {
      // Inicia na página do painel
      router.navigate('dashboard');
    });

  </script>
</body>
</html>
